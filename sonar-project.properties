# =============================================================================
# Configuración de SonarCloud - AUY1102 Evaluación Parcial 2
# =============================================================================

# Organización y proyecto en SonarCloud.
# Al importar el repo desde GitHub, SonarCloud crea la key como <org>_<repo>.
# Verifícala en SonarCloud > Project > Information y ajústala si es distinta.
sonar.organization=grupo-4duoc
sonar.projectKey=grupo-4duoc_AUY1102-Pipeline
sonar.projectName=AUY1102-Pipeline

# Código fuente y pruebas
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts,test/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Cobertura generada por: npm run test:coverage (scripts/run-tests.sh)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
